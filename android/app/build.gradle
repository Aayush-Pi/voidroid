plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.voidroid'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.voidroid"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.6.0-beta.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Only standard Android core libraries - no heavy UI frameworks needed
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
